# Append new sketches to this list. Fields:
# - image (required): path under /static or an absolute URL
# - alt (optional): accessible description
# - note (optional): small caption that shows under the sketch
# - variant (optional): style hint (tilt-left, tilt-right, float, tall, wide)
# - enabled (optional): set to false to temporarily hide the entry
#
# Example entries (disabled by default so they stay hidden until replaced):
- image: /scrapbook/painted_ladies.jpeg
  alt: "Painted Ladies"
  note: "Nob Hill, San Francisco, CA"
  variant: tilt-left
  enabled: true

- image: /scrapbook/social_study.jpeg
  alt: "The Social Study"
  note: "Japantown, San Francisco, CA"
  variant: tall
  enabled: true

- image: /scrapbook/yerba_buena.jpeg
  alt: "Yerba Buena Center for the Arts"
  note: "Downtown San Francisco, CA"
  variant: float
  enabled: true

- image: /scrapbook/saint_frank.jpeg
  alt: "Saint Frank Coffee"
  note: "Russian Hill, San Francisco, CA"
  variant: tilt-right
  enabled: true
