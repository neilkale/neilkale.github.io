{{ if .IsHome }}
  {{/* Animal overlays revealed once the page has settled */}}
  <div
    class="animals-overlay animals-overlay--birds"
    data-animals-overlay
    data-delay="5000"
    hidden
    aria-hidden="true"
  >
    <img
      src="{{ "birds.gif" | relURL }}"
      alt="Animated flock of birds"
      loading="lazy"
      decoding="async"
    />
  </div>

  <div
    class="animals-overlay animals-overlay--moose"
    data-animals-overlay
    data-delay="10000"
    data-visible-duration="12000"
    data-show-chance="0.2"
    hidden
    aria-hidden="true"
  >
    <img
      src="{{ "moose.gif" | relURL }}"
      alt="Animated moose"
      loading="lazy"
      decoding="async"
    />
  </div>

  <script>
  (function () {
    const overlays = Array.from(document.querySelectorAll("[data-animals-overlay]"));

    if (overlays.length === 0) {
      return;
    }

    const TRANSITION_MS = 500;

    const parseNumberAttr = (element, attributeName, fallback = 0) => {
      const attrValue = element.getAttribute(attributeName);
      const parsed = Number.parseInt(attrValue, 10);
      if (!Number.isFinite(parsed)) {
        return fallback;
      }
      return Math.max(0, parsed);
    };

    const parseChanceAttr = (element, attributeName) => {
      const attrValue = element.getAttribute(attributeName);
      if (attrValue === null) {
        return 1;
      }
      const parsed = Number.parseFloat(attrValue);
      if (!Number.isFinite(parsed)) {
        return 1;
      }
      return Math.min(Math.max(parsed, 0), 1);
    };

    const showOverlay = (overlay) => {
      overlay.removeAttribute("hidden");
      overlay.setAttribute("aria-hidden", "false");
      overlay.classList.add("is-visible");
    };

    const hideOverlay = (overlay) => {
      overlay.classList.remove("is-visible");
      overlay.setAttribute("aria-hidden", "true");
      window.setTimeout(() => {
        overlay.setAttribute("hidden", "");
      }, TRANSITION_MS);
    };

    const scheduleOverlay = () => {
      overlays.forEach((overlay) => {
        const showChance = parseChanceAttr(overlay, "data-show-chance");
        if (showChance <= 0 || (showChance < 1 && Math.random() >= showChance)) {
          return;
        }

        const delayMs = parseNumberAttr(overlay, "data-delay");
        const visibleDuration = parseNumberAttr(overlay, "data-visible-duration", 0);

        window.setTimeout(() => {
          showOverlay(overlay);
          if (visibleDuration > 0) {
            window.setTimeout(() => hideOverlay(overlay), visibleDuration);
          }
        }, delayMs);
      });
    };

    if (document.readyState === "complete") {
      scheduleOverlay();
    } else {
      window.addEventListener("load", scheduleOverlay, { once: true });
    }
  })();
  </script>
{{ end }}

{{ if eq .RelPermalink "/scrapbook/" }}
  <script>
  (function () {
    const grid = document.querySelector("[data-sketches-grid]");
    if (!grid) {
      return;
    }

    const cards = Array.from(grid.children);
    if (cards.length === 0) {
      return;
    }

    const getMetrics = () => {
      const styles = window.getComputedStyle(grid);
      const rowHeight = parseFloat(styles.getPropertyValue("--sketch-row-height")) || 12;
      const gapValue = styles.rowGap || styles.getPropertyValue("row-gap") || "0";
      const gap = parseFloat(gapValue) || 0;
      return { rowHeight, gap };
    };

    const setSpan = (card) => {
      if (!card) {
        return;
      }
      const { rowHeight, gap } = getMetrics();
      const span = Math.max(1, Math.ceil((card.offsetHeight + gap) / (rowHeight + gap)));
      card.style.gridRowEnd = `span ${span}`;
    };

    const applyToAll = () => {
      cards.forEach(setSpan);
    };

    const observeCards = () => {
      if (typeof ResizeObserver === "undefined") {
        applyToAll();
        return;
      }
      const observer = new ResizeObserver((entries) => {
        entries.forEach((entry) => setSpan(entry.target));
      });
      cards.forEach((card) => observer.observe(card));
    };

    const wireImages = () => {
      const images = grid.querySelectorAll("img");
      images.forEach((img) => {
        const update = () => setSpan(img.closest(".sketch-card"));
        if (img.complete) {
          update();
        } else {
          img.addEventListener("load", update, { once: true });
          img.addEventListener("error", update, { once: true });
        }
      });
    };

    window.addEventListener("resize", applyToAll, { passive: true });

    applyToAll();
    observeCards();
    wireImages();
  })();
  </script>
{{ end }}
